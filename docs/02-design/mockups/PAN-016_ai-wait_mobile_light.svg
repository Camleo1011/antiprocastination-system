<g id="contenido-principal" data-name="Contenido principal (main)" role="main">
<text x="16" y="99.4" font-size="24" fill="#1A1D21" font-weight="600">Desglose con IA</text>
<text x="16" y="129.4" font-size="14" fill="#4B5563">Preparar examen final · 26 h en 2 días</text>
<g id="tarjeta-1" data-name="Tarjeta">
<rect x="16" y="152" width="343" height="577" rx="12" fill="#1A1D21" fill-opacity="0.08"/><rect x="16.5" y="151.5" width="342" height="576" rx="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/>
<g id="indicador-espera-2" data-name="Indicador de espera indeterminado" role="progressbar" aria-busy="true">
<circle cx="187.5" cy="199" r="28" fill="none" stroke="#E3E8EF" stroke-width="6"/>
<circle cx="187.5" cy="199" r="28" fill="none" stroke="#4338CA" stroke-width="6" stroke-linecap="round" stroke-dasharray="49.26 175.93" transform="rotate(-60 187.5 199)"/>
<g transform="translate(175.5 187) scale(1)" fill="none" stroke="#4338CA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></g>
</g>
<text x="187.5" y="260.3" font-size="18" fill="#1A1D21" font-weight="600" text-anchor="middle">Estamos armando tu plan</text>
<text x="187.5" y="288.6" font-size="16" fill="#4B5563" text-anchor="middle">Puede tardar hasta 2 minutos. Mantén</text>
<text x="187.5" y="312.6" font-size="16" fill="#4B5563" text-anchor="middle">esta pantalla abierta; puedes cancelar la</text>
<text x="187.5" y="336.6" font-size="16" fill="#4B5563" text-anchor="middle">espera.</text>
<rect x="32" y="355" width="311" height="8" rx="4" fill="#E3E8EF"/>
<rect x="140.85" y="355" width="93.3" height="8" rx="4" fill="#4338CA"/>
<text x="187.5" y="396.6" font-size="16" fill="#1A1D21" font-weight="600" text-anchor="middle">Tiempo transcurrido: 1 min 15 s</text>
<g id="alerta-3" data-name="Alerta: Está tardando más de lo normal" role="status">
<rect x="32" y="411" width="311" height="114" rx="8" fill="#E6F1FB"/>
<rect x="32" y="411" width="4" height="114" rx="2" fill="#0B5CAD"/>
<g transform="translate(48 423) scale(0.83)" fill="none" stroke="#084A8C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></g>
<text x="80" y="440.6" font-size="16" fill="#084A8C" font-weight="600">Está tardando más de lo</text>
<text x="80" y="464.6" font-size="16" fill="#084A8C" font-weight="600">normal</text>
<text x="80" y="486.4" font-size="14" fill="#1A1D21">Seguimos esperando la respuesta de</text>
<text x="80" y="507.4" font-size="14" fill="#1A1D21">la IA. Tu meta ya está guardada.</text>
</g>
<g id="boton-4" data-name="Botón: Cancelar espera" data-interactive="button" data-orden-foco="7">
<rect x="32" y="541" width="311" height="44" fill="none" data-hit="1"/>
<rect x="33" y="542" width="309" height="42" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
<text x="187.5" y="568.6" font-size="16" fill="#4338CA" font-weight="600" text-anchor="middle">Cancelar espera</text>
</g>
<g id="boton-5" data-name="Botón: Armar manualmente" data-interactive="button" data-orden-foco="8">
<rect x="32" y="593" width="311" height="44" fill="none" data-hit="1"/>
<rect x="32" y="593" width="311" height="44" rx="8" fill="#4338CA"/>
<text x="187.5" y="620.6" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Armar manualmente</text>
</g>
<text x="187.5" y="664.4" font-size="14" fill="#4B5563" text-anchor="middle">Si cancelas, podrás ver el estado real en el</text>
<text x="187.5" y="685.4" font-size="14" fill="#4B5563" text-anchor="middle">detalle de la meta; el desglose manual siempre</text>
<text x="187.5" y="706.4" font-size="14" fill="#4B5563" text-anchor="middle">está disponible.</text>
</g>
</g>
