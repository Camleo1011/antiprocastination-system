<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="816" viewBox="0 0 375 816" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-016" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-016 — Desglose por IA: espera, resultado y fallo (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Desglose por IA: espera, resultado y fallo. Ruta /metas/:id/desglose; rol cliente; CU CU-006, CU-032; EP EP-027, EP-024, EP-028. Estado mostrado: espera síncrona pasados los 60 s: aviso 'tarda más de lo normal', cancelar y salida manual. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Sin tiempo límite impuesto al usuario (WCAG 2.2.1); el tiempo transcurrido se anuncia cada 15 s, no cada segundo. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: Cancelar espera; 8 Botón: Armar manualmente.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E8EF"/><rect width="3" height="6" fill="#8A4B00"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="816" fill="#F5F7FA"/>
