<title id="t">PAN-013 — Crear meta: tipo de desglose (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Crear meta: tipo de desglose. Ruta /metas/nueva/desglose; rol cliente; CU CU-005, CU-006, CU-032; EP EP-014. Estado mostrado: paso 4 de 6: elegir entre desglose por IA y manual; la meta requiere evidencia y el consentimiento de IA ya fue aceptado. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Una meta de 1 día salta este paso (RF-META-031). Sin consentimiento de IA la opción IA abre PAN-028 y, si se rechaza, queda el desglose manual. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: Elegir desglose por IA; 8 Botón: Elegir desglose manual; 9 Botón: ‹ Atrás.</desc>
