<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-004" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-004 — Recuperar contraseña: restablecer (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Recuperar contraseña: restablecer. Ruta /recuperar/restablecer; rol visitante; CU CU-003; EP EP-008. Estado mostrado: formulario completo y listo para enviar (EP-008). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. El código vence en 10 minutos (texto estático, sin cuenta regresiva). Un código inválido, usado o vencido da un único mensaje. Regiones ARIA: banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Campo: Código de 6 dígitos; 2 Campo: Nueva contraseña; 3 Campo: Confirma la contraseña; 4 Botón: Restablecer contraseña; 5 Botón: Pedir un código nuevo.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="812" fill="#0F1114"/>
