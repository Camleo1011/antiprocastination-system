<title id="t">PAN-008 — Mis metas (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Mis metas. Ruta /metas; rol cliente; CU CU-022; EP EP-022. Estado mostrado: listado de 5 metas de Ana con estado en texto e ícono, categoría, avance y si requiere evidencia. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Franja de color de la meta solo decorativa (el nombre y el estado van en texto). Estado vacío: «Aún no tienes metas» con CTA (no se muestra en este mockup). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: + Nueva meta; 8 Selector: Estado: todos; 9 Selector: Categoría: todas; 10 Selector: Orden: más recientes; 11 Botón: Anterior; 12 Botón: Siguiente.</desc>
