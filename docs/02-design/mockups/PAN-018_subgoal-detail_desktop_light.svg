<title id="t">PAN-018 — Detalle de submeta (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Detalle de submeta. Ruta /submetas/:id; rol cliente; CU CU-011, CU-009, CU-013, CU-015, CU-016; EP EP-031, EP-032, EP-037. Estado mostrado: en curso en el periodo inicial pasado el 80 %: carga de evidencia habilitada; reloj, barra con marca del 80 % y tramo de gracia. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Ventanas inicial/gracia (BR-001, BR-003, RF-PUNT-007): el reloj dura 2 h desde el inicio real (09:02, BR-006, BR-032), así termina a las 11:02, el 80 % es a las 10:38 y la gracia (10 % = 12 min) llega hasta las 11:14. El reloj no usa aria-live por segundo. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: ‹ Volver a la agenda; 8 Botón: Cargar evidencia; 9 Botón: Abrir Pomodoro.</desc>
