<rect x="452" y="206" width="376" height="111" rx="8" fill="#FFF4DB"/>
<rect x="452" y="206" width="4" height="111" rx="2" fill="#B45309"/>
<g transform="translate(468 218) scale(0.83)" fill="none" stroke="#8A4B00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.8 19.5h18.4z"/><path d="M12 10v4.5"/><path d="M12 17.2v.1"/></g>
<text x="500" y="235.6" font-size="16" fill="#8A4B00" font-weight="600">Demasiados intentos</text>
<text x="500" y="257.4" font-size="14" fill="#1A1D21">Tu cuenta quedó bloqueada 15 minutos por</text>
<text x="500" y="278.4" font-size="14" fill="#1A1D21">intentos fallidos. Te enviamos un correo con la</text>
<text x="500" y="299.4" font-size="14" fill="#1A1D21">explicación.</text>
</g>
<g id="tarjeta-3" data-name="Tarjeta">
<rect x="452" y="334" width="376" height="184" rx="12" fill="#1A1D21" fill-opacity="0.08"/><rect x="452.5" y="333.5" width="375" height="183" rx="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/>
<g transform="translate(476 359) scale(0.83)" fill="none" stroke="#8A4B00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 7v5l3 2"/></g>
<text x="504" y="374" font-size="16" fill="#8A4B00" font-weight="600">Tiempo restante de bloqueo</text>
<text x="476" y="432.6" font-size="48" fill="#1A1D21" font-weight="700" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="timer">14:32</text>
<text x="476" y="466.4" font-size="14" fill="#4B5563">Se anuncia cada 30 s y al terminar; después</text>
<text x="476" y="487.4" font-size="14" fill="#4B5563">podrás volver a intentarlo.</text>
