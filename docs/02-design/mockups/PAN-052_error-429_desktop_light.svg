<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="859" viewBox="0 0 1280 859" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-052" data-dispositivo="desktop" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-052 — Error 429: demasiados intentos o solicitudes (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Error 429: demasiados intentos o solicitudes. Ruta (estado en la página); rol todos; CU CU-002, CU-001, CU-003; EP EP-004, EP-003, EP-007, EP-008. Estado mostrado: 429 por 5 intentos fallidos: bloqueo de 15 min con cuenta regresiva, botón deshabilitado y salida a recuperar contraseña. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Retry-After se muestra como texto y cuenta regresiva (sin aria-live continuo). Al terminar se habilita el botón y el foco pasa al campo. Regiones ARIA: banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Campo: Correo electrónico; 2 Campo: Contraseña; 3 Botón: Ingresar; 4 Botón: Recuperar contraseña.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E8EF"/><rect width="3" height="6" fill="#8A4B00"/></pattern></defs>
<rect id="fondo-pagina" width="1280" height="859" fill="#F5F7FA"/>
<g id="cabecera" data-name="Cabecera" role="banner">
