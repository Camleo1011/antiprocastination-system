<title id="t">PAN-034 — Cuentas: editar (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Cuentas: editar. Ruta /admin/cuentas/:id/editar; rol moderador+; CU CU-019; EP EP-046, EP-045. Estado mostrado: 409 CORREO_DUPLICADO: el correo escrito pertenece a otra cuenta; se conserva lo escrito. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. El moderador edita solo cuentas cliente (BR-021). Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Navegación: Métricas; 6 Navegación: Error persistente; 7 Menú de cuenta; 8 Botón: ‹ Ana Gómez; 9 Campo: Nombre; 10 Campo: Correo; 11 Botón: Cancelar; 12 Botón: Guardar.</desc>
