<title id="t">PAN-042 — Evidencia: detalle y archivo (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Evidencia: detalle y archivo. Ruta /admin/evidencias/:id; rol soporte+; CU CU-021, CU-023; EP EP-038, EP-039. Estado mostrado: detalle de un envío Excelente con vista previa de la imagen y descarga del archivo, con aviso de contenido privado. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Imágenes, PDF y TXT se previsualizan; Word y Excel solo se descargan. El acceso queda registrado sin guardar el contenido. 404 → PAN-049. Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Navegación: Métricas; 6 Navegación: Error persistente; 7 Menú de cuenta; 8 Botón: ‹ Evidencias; 9 Botón: Descargar archivo.</desc>
