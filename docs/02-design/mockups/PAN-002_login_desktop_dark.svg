<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-002" data-dispositivo="desktop" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-002 — Inicio de sesión (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Inicio de sesión. Ruta /ingresar; rol visitante; CU CU-002, CU-004; EP EP-004, EP-006. Estado mostrado: 401 CREDENCIALES_INVALIDAS con mensaje único (no revela si el correo existe). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Un solo mensaje para credenciales inválidas (anti-enumeración). Regiones ARIA: banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Campo: Correo electrónico; 2 Campo: Contraseña; 3 Botón: Ingresar; 4 Botón: ¿Olvidaste tu contraseña?; 5 Botón: Crear cuenta.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
<rect id="fondo-pagina" width="1280" height="800" fill="#161A20"/>
