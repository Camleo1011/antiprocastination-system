<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-053" data-dispositivo="desktop" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-053 — Error 5xx: fallo del servidor o servicio no disponible (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Error 5xx: fallo del servidor o servicio no disponible. Ruta (estado en la página); rol todos; CU CU-006, CU-013, CU-014; EP EP-001, EP-002. Estado mostrado: 500: mensaje sin detalles técnicos, código de referencia y reintento. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Nunca se muestran trazas ni detalles internos; la referencia sirve para soporte (RNF-004). 502/504 de la IA se tratan en cada pantalla. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: Reintentar; 8 Botón: Comprobar estado.</desc>
