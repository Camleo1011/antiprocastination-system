<title id="t">PAN-050 — Error 409: conflicto (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Error 409: conflicto. Ruta (panel o pantalla); rol todos; CU CU-005, CU-008a, CU-009, CU-013, CU-019, CU-020, CU-023, CU-030; EP EP-025, EP-032, EP-036, EP-041, EP-047, EP-048, EP-050, EP-058. Estado mostrado: 409 en contexto: aviso con qué pasó, por qué y salida, más el catálogo de conflictos frecuentes (el recurso se refresca tras el 409). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Tras un 409 se vuelve a leer el recurso afectado. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: ‹ Aprender cálculo; 8 Botón: Volver a la meta; 9 Botón: Ver submetas.</desc>
