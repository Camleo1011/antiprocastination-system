<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-004" data-dispositivo="desktop" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-004 — Recuperar contraseña: restablecer (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Recuperar contraseña: restablecer. Ruta /recuperar/restablecer; rol visitante; CU CU-003; EP EP-008. Estado mostrado: 422 CONTRASENA_DEBIL: el código sigue vigente y se conserva lo escrito. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. El código vence en 10 minutos (texto estático, sin cuenta regresiva). Un código inválido, usado o vencido da un único mensaje. Regiones ARIA: banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Campo: Código de 6 dígitos; 2 Campo: Nueva contraseña; 3 Campo: Confirma la contraseña; 4 Botón: Restablecer contraseña; 5 Botón: Pedir un código nuevo.</desc>
