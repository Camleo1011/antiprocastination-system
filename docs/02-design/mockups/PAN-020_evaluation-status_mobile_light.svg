<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-020" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-020 — Estado de la evaluación y reintento (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Estado de la evaluación y reintento. Ruta /submetas/:id/evaluacion; rol cliente; CU CU-023, CU-014, CU-015; EP EP-037, EP-040, EP-041, EP-038, EP-031. Estado mostrado: envío 1 evaluado como Incoherente (50 puntos): se ofrece el segundo envío, que vale la mitad. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Dictamen en texto con ícono (BR-031). «Inválida» no es «Error»; Error es un fallo técnico que no consume envío y permite reintentar (RF-EVID-008). Sondeo cada 5-10 s sin aria-live continuo. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: ‹ Estudiar capítulo 3; 8 Botón: Enviar segunda evidencia; 9 Botón: Volver a la submeta.</desc>
