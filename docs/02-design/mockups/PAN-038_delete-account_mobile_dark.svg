<g id="dialogo" data-name="Diálogo: ¿Eliminar la cuenta de Luis Prada?" role="alertdialog" aria-modal="true">
<rect x="16.5" y="124.5" width="342" height="563" rx="16" fill="#232A33" stroke="#2A323D" stroke-width="1"/>
<text x="40" y="165.3" font-size="18" fill="#F1F3F7" font-weight="600">¿Eliminar la cuenta de Luis</text>
<text x="40" y="187.3" font-size="18" fill="#F1F3F7" font-weight="600">Prada?</text>
<text x="40" y="221.6" font-size="16" fill="#F1F3F7">Se borra en cascada:</text>
<circle cx="46" cy="256" r="3" fill="#F1F3F7"/>
<text x="60" y="261.6" font-size="16" fill="#F1F3F7">metas, submetas, evidencias y sus</text>
<text x="60" y="285.6" font-size="16" fill="#F1F3F7">archivos</text>
<circle cx="46" cy="304" r="3" fill="#F1F3F7"/>
<text x="60" y="309.6" font-size="16" fill="#F1F3F7">logros, días activos y puntaje</text>
<text x="40" y="347.4" font-size="14" fill="#C3CAD6">No se puede deshacer. Si la cuenta es de</text>
<text x="40" y="368.4" font-size="14" fill="#C3CAD6">administrador, las submetas que cerró</text>
<text x="40" y="389.4" font-size="14" fill="#C3CAD6">permanecen finalizadas.</text>
