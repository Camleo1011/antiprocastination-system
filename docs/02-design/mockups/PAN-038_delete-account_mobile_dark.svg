<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-038" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-038 — Eliminar cuenta (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Eliminar cuenta. Ruta (modal); rol super; CU CU-019; EP EP-047. Estado mostrado: super confirma eliminar una cuenta: correo escrito y casilla marcada, listo para confirmar. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Doble confirmación: escribir el correo y marcar la casilla; el cliente envía confirmar=true (RF-ADM-010). Errores 409 AUTOELIMINACION y ULTIMO_SUPER. Regiones ARIA: banner, navigation, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Campo: Escribe el correo de la cuenta para confirmar; 2 Casilla: Entiendo que no se puede deshacer; 3 Botón: Cancelar; 4 Botón: Eliminar cuenta.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
