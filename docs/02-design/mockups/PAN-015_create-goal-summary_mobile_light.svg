<title id="t">PAN-015 — Crear meta: resumen y guardar (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Crear meta: resumen y guardar. Ruta /metas/nueva/resumen; rol cliente; CU CU-005; EP EP-023. Estado mostrado: paso 6 de 6: resumen de la meta «Preparar examen final» con enlaces «Cambiar» a cada paso y botón Guardar meta. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Los errores de validación del servidor enlazan al paso que contiene el campo. Tras guardar con desglose por IA se abre PAN-016 (EP-023, EP-027). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: Cambiar; 8 Botón: Cambiar; 9 Botón: Cambiar; 10 Botón: Cambiar; 11 Botón: Atrás; 12 Botón: Guardar meta.</desc>
