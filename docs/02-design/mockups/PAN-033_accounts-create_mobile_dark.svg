<text x="64" y="222.4" font-size="14" fill="#F1F3F7">años en su primer inicio de sesión. Su</text>
<text x="64" y="243.4" font-size="14" fill="#F1F3F7">zona horaria será America/Bogota hasta</text>
<text x="64" y="264.4" font-size="14" fill="#F1F3F7">entonces.</text>
