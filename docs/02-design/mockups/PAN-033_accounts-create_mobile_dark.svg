<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-033" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-033 — Cuentas: crear (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Cuentas: crear. Ruta /admin/cuentas/nueva; rol moderador+; CU CU-019; EP EP-044. Estado mostrado: sesión moderador creando un cliente: la opción «Administrador» no aparece. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Crear administradores es exclusivo del super (BR-021, RF-ADM-014). La contraseña inicial sigue la política de RF-AUT-011. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: ‹ Cuentas; 3 Campo: Nombre; 4 Campo: Correo; 5 Campo: Contraseña inicial; 6 Casilla: Cliente; 7 Botón: Cancelar; 8 Botón: Crear cuenta.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="812" fill="#161A20"/>
