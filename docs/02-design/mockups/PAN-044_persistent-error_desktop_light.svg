<title id="t">PAN-044 — Evaluaciones en Error persistente (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Evaluaciones en Error persistente. Ruta /admin/error-persistente; rol moderador+; CU CU-030; EP EP-056. Estado mostrado: 2 evaluaciones con 48 h o más en Error, ordenadas por antigüedad, con acción Elegir (abre PAN-045). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Solo moderador o super (CU-030); soporte recibe 403 NIVEL_ADMIN_INSUFICIENTE. Datos coherentes con PAN-030, 041 y 045. Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Navegación: Métricas; 6 Navegación: Error persistente; 7 Menú de cuenta; 8 Botón: Elegir; 9 Botón: Elegir; 10 Botón: Anterior; 11 Botón: Siguiente.</desc>
