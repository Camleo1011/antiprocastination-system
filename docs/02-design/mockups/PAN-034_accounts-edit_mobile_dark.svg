<g transform="translate(14 16) scale(1)" fill="none" stroke="#F1F3F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></g>
</g>
</g>
