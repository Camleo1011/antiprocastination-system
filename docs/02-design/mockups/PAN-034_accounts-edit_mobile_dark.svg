<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-034" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-034 — Cuentas: editar (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Cuentas: editar. Ruta /admin/cuentas/:id/editar; rol moderador+; CU CU-019; EP EP-046, EP-045. Estado mostrado: edición de una cuenta cliente por un moderador, lista para guardar. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. El moderador edita solo cuentas cliente (BR-021). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: ‹ Ana Gómez; 3 Campo: Nombre; 4 Campo: Correo; 5 Botón: Cancelar; 6 Botón: Guardar.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="812" fill="#161A20"/>
<g id="barra-superior" data-name="Barra superior de administración" role="banner">
<rect x="0" y="0" width="375" height="56" fill="#1C2128"/>
<line x1="0" y1="56" x2="375" y2="56" stroke="#2A323D" stroke-width="1"/>
