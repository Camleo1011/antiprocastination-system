<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-021" data-dispositivo="desktop" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-021 — Resultado y puntaje de la submeta (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Resultado y puntaje de la submeta. Ruta /submetas/:id/resultado; rol cliente; CU CU-016, CU-026, CU-011; EP EP-031, EP-010. Estado mostrado: submeta finalizada con dos envíos (Incoherente 50 + Excelente 50 = 100, tope 90) y tabla de los tres dictámenes. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Dictamen en texto + ícono + color (BR-031); 'Inválida' no es 'Error' (Error es un fallo técnico). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: Volver a la agenda; 8 Botón: Ver mi perfil.</desc>
