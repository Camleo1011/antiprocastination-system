<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1301" viewBox="0 0 375 1301" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-030" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-030 — Panel de administración (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Panel de administración. Ruta /admin; rol soporte+; CU CU-002, CU-021, CU-019, CU-030; EP EP-006, EP-052, EP-056. Estado mostrado: panel del moderador: 4 indicadores, aviso de 2 evaluaciones en Error persistente y accesos a sus secciones; sin tarjeta de métricas del LLM (solo super). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. La interfaz oculta lo que el nivel no permite (BR-021): soporte no ve métricas ni Error persistente; solo el super ve métricas del LLM. El nivel se muestra en texto. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: Abrir cuentas; 3 Botón: Abrir evidencias; 4 Botón: Abrir ranking; 5 Botón: Abrir lista; 6 Botón: Abrir métricas.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E8EF"/><rect width="3" height="6" fill="#8A4B00"/></pattern></defs>
