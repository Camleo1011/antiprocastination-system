<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-001" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-001 — Registro (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Registro. Ruta /registro; rol visitante; CU CU-001; EP EP-003. Estado mostrado: formulario completo y declaración 18+ marcada, listo para enviar (EP-003 con confirma_mayoria_edad=true). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Declaración 18+ obligatoria y sin premarcar (RF-AUT-017). La política de contraseña se ve antes de escribir. Regiones ARIA: banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Campo: Nombre; 2 Campo: Correo electrónico; 3 Campo: Contraseña; 4 Casilla: Declaro ser mayor de 18 años; 5 Botón: Crear cuenta; 6 Botón: ¿Ya tienes cuenta? Inicia sesión.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E8EF"/><rect width="3" height="6" fill="#8A4B00"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="812" fill="#FFFFFF"/>
<g id="cabecera" data-name="Cabecera" role="banner">
<rect x="0" y="0" width="375" height="56" fill="#FFFFFF"/>
<line x1="0" y1="56" x2="375" y2="56" stroke="#D7DDE8" stroke-width="1"/>
<g id="logo-11" data-name="Logotipo FocusStrike" data-exempt="logo">
<rect x="16" y="12" width="32" height="32" rx="8" fill="#4338CA"/>
<g transform="translate(22.4 18.4) scale(0.8)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/><path d="M12 12v.1"/></g>
<text x="58" y="34.3" font-size="18" fill="#1A1D21" font-weight="700">FocusStrike</text>
</g>
</g>
<g id="contenido-principal" data-name="Contenido principal (main)" role="main">
<text x="16" y="99.4" font-size="24" fill="#1A1D21" font-weight="600">Crear cuenta</text>
<text x="16" y="129.4" font-size="14" fill="#4B5563">FocusStrike es para personas de 18 años o más.</text>
<g id="campo-1" data-name="Campo: Nombre">
<text x="16" y="166.4" font-size="14" fill="#1A1D21" font-weight="600">Nombre</text>
<g id="entrada-2" data-name="Entrada" data-interactive="input" data-orden-foco="1">
<rect x="16" y="176" width="343" height="44" fill="none" data-hit="1"/>
<rect x="17" y="177" width="341" height="42" rx="8" fill="#FFFFFF" stroke="#6B7385" stroke-width="1"/>
<text x="28" y="203.6" font-size="16" fill="#1A1D21">Ana Gómez</text>
</g>
</g>
<g id="campo-3" data-name="Campo: Correo electrónico">
<text x="16" y="251.4" font-size="14" fill="#1A1D21" font-weight="600">Correo electrónico</text>
<g id="entrada-4" data-name="Entrada" data-interactive="input" data-orden-foco="2">
<rect x="16" y="261" width="343" height="44" fill="none" data-hit="1"/>
<rect x="17" y="262" width="341" height="42" rx="8" fill="#FFFFFF" stroke="#6B7385" stroke-width="1"/>
<text x="28" y="288.6" font-size="16" fill="#1A1D21">ana.gomez@correo.com</text>
</g>
</g>
<g id="campo-5" data-name="Campo: Contraseña">
<text x="16" y="336.4" font-size="14" fill="#1A1D21" font-weight="600">Contraseña</text>
<g id="entrada-6" data-name="Entrada" data-interactive="input" data-orden-foco="3">
<rect x="16" y="346" width="343" height="44" fill="none" data-hit="1"/>
<rect x="17" y="347" width="341" height="42" rx="8" fill="#FFFFFF" stroke="#6B7385" stroke-width="1"/>
<text x="28" y="373.6" font-size="16" fill="#1A1D21">•••••••••••</text>
<text x="347" y="372.9" font-size="14" fill="#4338CA" font-weight="600" text-anchor="end">Mostrar</text>
</g>
<text x="16" y="409.4" font-size="14" fill="#4B5563">Mínimo 8 caracteres, con una letra y un número</text>
</g>
<text x="16" y="446.4" font-size="14" fill="#4B5563">Usaremos tu zona horaria: America/Bogota; podrás</text>
<text x="16" y="467.4" font-size="14" fill="#4B5563">cambiarla en Preferencias.</text>
<g id="declaracion-7" data-name="Declaración de mayoría de edad">
<rect x="17" y="490" width="341" height="125" rx="8" fill="#F5F7FA" stroke="#6B7385" stroke-width="1"/>
<g id="casilla-8" data-name="Casilla: Declaro ser mayor de 18 años" data-interactive="check" data-orden-foco="4">
<rect x="32" y="497" width="311" height="44" fill="none" data-hit="1"/>
<rect x="32" y="507" width="24" height="24" rx="4" fill="#4338CA"/>
<g transform="translate(35 510) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></g>
<text x="68" y="524.6" font-size="16" fill="#1A1D21">Declaro ser mayor de 18 años</text>
</g>
<text x="68" y="556.4" font-size="14" fill="#4B5563">Solo guardamos la fecha y hora de tu</text>
<text x="68" y="577.4" font-size="14" fill="#4B5563">declaración, nunca tu fecha de</text>
<text x="68" y="598.4" font-size="14" fill="#4B5563">nacimiento.</text>
</g>
<g id="boton-9" data-name="Botón: Crear cuenta" data-interactive="button" data-orden-foco="5">
<rect x="16" y="632" width="343" height="44" fill="none" data-hit="1"/>
<rect x="16" y="632" width="343" height="44" rx="8" fill="#4338CA"/>
<text x="187.5" y="659.6" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Crear cuenta</text>
</g>
<g id="boton-10" data-name="Botón: ¿Ya tienes cuenta? Inicia sesión" data-interactive="link" data-orden-foco="6">
<rect x="16" y="680" width="296.77" height="44" fill="none" data-hit="1"/>
<text x="16" y="707.6" font-size="16" fill="#4338CA" font-weight="600">¿Ya tienes cuenta? Inicia sesión</text>
<line x1="16" y1="710.6" x2="262.5" y2="710.6" stroke="#4338CA" stroke-width="1"/>
</g>
</g>
</svg>
