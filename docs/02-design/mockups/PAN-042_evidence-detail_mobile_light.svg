<text x="32" y="506.4" font-size="14" fill="#4B5563">Dictamen</text>
<text x="162.62" y="508.6" font-size="16" fill="#1A1D21">Excelente</text>
<text x="32" y="534.4" font-size="14" fill="#4B5563">Justificación</text>
