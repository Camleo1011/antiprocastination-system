<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1043" viewBox="0 0 375 1043" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-042" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-042 — Evidencia: detalle y archivo (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Evidencia: detalle y archivo. Ruta /admin/evidencias/:id; rol soporte+; CU CU-021, CU-023; EP EP-038, EP-039. Estado mostrado: detalle de un envío Excelente con vista previa de la imagen y descarga del archivo, con aviso de contenido privado. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Imágenes, PDF y TXT se previsualizan; Word y Excel solo se descargan. El acceso queda registrado sin guardar el contenido. 404 → PAN-049. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: ‹ Evidencias; 3 Botón: Descargar archivo.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E8EF"/><rect width="3" height="6" fill="#8A4B00"/></pattern></defs>
