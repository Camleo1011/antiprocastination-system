<rect x="33" y="694" width="309" height="198" rx="8" fill="#EBEEF3" stroke="#D7DDE8" stroke-width="1"/>
<g transform="translate(167.5 759) scale(1.67)" fill="none" stroke="#4B5563" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></g>
