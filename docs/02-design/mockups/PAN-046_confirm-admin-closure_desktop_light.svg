<title id="t">PAN-046 — Confirmar cierre administrativo (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Confirmar cierre administrativo. Ruta (modal); rol moderador+; CU CU-030; EP EP-058. Estado mostrado: confirmación del cierre administrativo (mismo patrón que PAN-029): casilla sin marcar con mensaje CONFIRMACION_REQUERIDA; foco inicial en Cancelar. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. El cliente envía confirmar=true (EP-058). 409 CIERRE_ADMIN_NO_PROCEDE si la evaluación se resolvió mientras tanto. Regiones ARIA: navigation, banner, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Casilla: Entiendo las consecuencias; 2 Botón: Cancelar; 3 Botón: Cerrar submeta.</desc>
