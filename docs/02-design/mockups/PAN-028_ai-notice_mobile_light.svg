<g transform="translate(32 892) scale(0.83)" fill="none" stroke="#084A8C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></g>
<text x="64" y="909.6" font-size="16" fill="#084A8C" font-weight="600">Falta aceptar el uso de IA</text>
<text x="64" y="931.4" font-size="14" fill="#1A1D21">Para evaluar tus evidencias se usa un</text>
<text x="64" y="952.4" font-size="14" fill="#1A1D21">servicio externo de IA. Antes de continuar</text>
<text x="64" y="973.4" font-size="14" fill="#1A1D21">debes revisar y aceptar su uso.</text>
</g>
