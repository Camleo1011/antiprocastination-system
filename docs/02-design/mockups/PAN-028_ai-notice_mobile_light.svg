<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1440" viewBox="0 0 375 1440" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-028" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-028 — Aviso de consentimiento de IA (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Aviso de consentimiento de IA. Ruta (modal); rol cliente; CU CU-005, CU-006, CU-007, CU-013, CU-025; EP EP-014, EP-015. Estado mostrado: aviso de consentimiento de IA abierto desde «Revisar y aceptar» del paso 1; los dos botones tienen el mismo peso visual (sin patrón oscuro); foco inicial en «Ahora no». Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Se abre en el punto de uso, no antes. Elegir «Ahora no» devuelve al flujo con la alternativa sin IA y 0 llamadas a la IA (RF-IA-010, RF-IA-011). Regiones ARIA: banner, navigation, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Botón: Ahora no; 2 Botón: Acepto el uso de IA.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E8EF"/><rect width="3" height="6" fill="#8A4B00"/></pattern></defs>
