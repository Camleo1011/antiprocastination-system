<rect x="0" y="0" width="375" height="1440" fill="#1A1D21" fill-opacity="0.6" id="telon"/>
<g id="dialogo" data-name="Diálogo: Uso de un servicio externo de IA" role="alertdialog" aria-modal="true">
<rect x="16" y="149.5" width="343" height="525" rx="16" fill="#1A1D21" fill-opacity="0.16"/>
<rect x="16.5" y="144" width="342" height="524" rx="16" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/>
<text x="40" y="184.8" font-size="18" fill="#1A1D21" font-weight="600">Uso de un servicio externo de IA</text>
<text x="40" y="219.1" font-size="16" fill="#1A1D21">Para evaluar tu evidencia y armar tu</text>
<text x="40" y="243.1" font-size="16" fill="#1A1D21">plan usamos un servicio externo de IA.</text>
<text x="40" y="281.1" font-size="16" fill="#1A1D21" font-weight="600">Se envía</text>
<circle cx="46" cy="303.5" r="3" fill="#1A1D21"/>
<text x="60" y="309.1" font-size="16" fill="#1A1D21">la descripción de la meta</text>
<circle cx="46" cy="327.5" r="3" fill="#1A1D21"/>
<text x="60" y="333.1" font-size="16" fill="#1A1D21">los archivos de evidencia (sin</text>
<text x="60" y="357.1" font-size="16" fill="#1A1D21">metadatos de imagen)</text>
<text x="40" y="395.1" font-size="16" fill="#1A1D21" font-weight="600">No se envía</text>
<circle cx="46" cy="417.5" r="3" fill="#1A1D21"/>
<text x="60" y="423.1" font-size="16" fill="#1A1D21">tu nombre, tu correo ni</text>
<text x="60" y="447.1" font-size="16" fill="#1A1D21">identificadores</text>
<text x="40" y="484.9" font-size="14" fill="#4B5563">Si no aceptas, solo puedes crear metas sin</text>
<text x="40" y="505.9" font-size="14" fill="#4B5563">evidencia, sin desglose automático,</text>
<text x="40" y="526.9" font-size="14" fill="#4B5563">recomendaciones ni fechas sugeridas.</text>
<g id="boton-30" data-name="Botón: Ahora no" data-interactive="button" data-orden-foco="1">
<rect x="40" y="548.5" width="295" height="44" fill="none" data-hit="1"/>
<rect x="37" y="545.5" width="301" height="50" rx="11" fill="none" stroke="#4338CA" stroke-width="2"/>
<rect x="41" y="549.5" width="293" height="42" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
<text x="187.5" y="576.1" font-size="16" fill="#4338CA" font-weight="600" text-anchor="middle">Ahora no</text>
</g>
<g id="boton-31" data-name="Botón: Acepto el uso de IA" data-interactive="button" data-orden-foco="2">
<rect x="40" y="600.5" width="295" height="44" fill="none" data-hit="1"/>
<rect x="41" y="601.5" width="293" height="42" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
<text x="187.5" y="628.1" font-size="16" fill="#4338CA" font-weight="600" text-anchor="middle">Acepto el uso de IA</text>
</g>
