<svg xmlns="http://www.w3.org/2000/svg" width="375" height="838" viewBox="0 0 375 838" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-036" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-036 — Cambiar rol de la cuenta (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Cambiar rol de la cuenta. Ruta (modal); rol super; CU CU-019; EP EP-048. Estado mostrado: super convierte una cuenta cliente sin datos en administrador con nivel soporte; advertencia de consecuencias. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Solo se ofrece si la cuenta no tiene datos (409 CUENTA_CON_DATOS); exclusivo del super. Regiones ARIA: banner, navigation, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Casilla: Administrador; 2 Campo: Nivel de acceso; 3 Botón: Cancelar; 4 Botón: Cambiar rol.</desc>
