<svg xmlns="http://www.w3.org/2000/svg" width="375" height="970" viewBox="0 0 375 970" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-027" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-027 — Preferencias de cuenta (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Preferencias de cuenta. Ruta /preferencias; rol cliente; CU CU-027, CU-028; EP EP-012, EP-013, EP-016, EP-017, EP-018, EP-014, EP-015. Estado mostrado: tras guardar: aviso «Preferencias guardadas» (EP-016). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Cambiar la zona horaria no recalcula los días activos pasados (RF-PER-008). El permiso de push lo decide el navegador (RF-NOT-007). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Campo: Zona horaria; 8 Conmutador: Recibir notificaciones push; 9 Botón: Revisar el aviso de IA; 10 Botón: Guardar preferencias.</desc>
