<title id="t">PAN-007 — Agenda (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Agenda. Ruta /agenda; rol cliente; CU CU-010; EP EP-029, EP-030. Estado mostrado: mes de noviembre de 2026 con la agenda de Ana: submetas por día con franja de color de la meta, ícono de estado y leyenda en texto (móvil: lista por día). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Estado de submeta con ícono y texto (BR-031); en la rejilla el texto del estado está en la leyenda y en el aria-label de cada submeta. Rango máximo 93 días (RANGO_AGENDA_EXCEDIDO). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Selector: Mes: noviembre 2026; 8 Selector: Estado: todos; 9 Selector: Meta: todas; 10 Botón: ‹ Mes anterior; 11 Botón: Hoy; 12 Botón: Mes siguiente ›; 13 Fila: Repasar vocabulario; 14 Fila: Estudiar capítulo 3; 15 Fila: Leer capítulo 2; 16 Fila: Caminar 30 min; 17 Fila: Repasar vocabulario; 18 Fila: Estudiar capítulo 4; 19 Fila: Caminar 30 min.</desc>
