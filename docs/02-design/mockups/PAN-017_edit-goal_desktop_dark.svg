<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-017" data-dispositivo="desktop" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-017 — Editar meta (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Editar meta. Ruta /metas/:id/editar; rol cliente; CU CU-008a, CU-032, CU-006; EP EP-025, EP-024, EP-028, EP-027. Estado mostrado: edición de una meta con submetas iniciadas: nombre, categoría y descripción editables; el resto bloqueado con motivo en texto (409 META_CON_SUBMETAS_INICIADAS). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. El bloqueo se comunica con candado y texto, no solo con atenuado. Cambiar fechas, tiempo u horario (sin submetas iniciadas) regeneraría las submetas (RF-META-027). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: ‹ Aprender cálculo; 8 Campo: Nombre de la meta; 9 Campo: Categoría; 10 Campo: Descripción; 11 Botón: Cancelar; 12 Botón: Guardar cambios.</desc>
