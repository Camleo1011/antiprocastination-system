<rect x="75" y="748" width="75" height="64" fill="none" data-hit="1"/>
<g transform="translate(100.5 756) scale(1)" fill="none" stroke="#4B5563" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4z"/><path d="M4 10h16M8 3v4M16 3v4"/></g>
<text x="112.5" y="798" font-size="14" fill="#4B5563" font-weight="600" text-anchor="middle">Agenda</text>
</g>
<g id="nav-9" data-name="Navegación: Metas" data-interactive="link" data-orden-foco="4">
<rect x="150" y="748" width="75" height="64" fill="none" data-hit="1"/>
<g transform="translate(175.5 756) scale(1)" fill="none" stroke="#4B5563" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/><path d="M12 12v.1"/></g>
<text x="187.5" y="798" font-size="14" fill="#4B5563" font-weight="600" text-anchor="middle">Metas</text>
</g>
<g id="nav-10" data-name="Navegación: Ranking" data-interactive="link" data-orden-foco="5">
<rect x="225" y="748" width="75" height="64" fill="none" data-hit="1"/>
<g transform="translate(250.5 756) scale(1)" fill="none" stroke="#4B5563" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v6a4 4 0 01-8 0z"/><path d="M8 6H4v2a3 3 0 003 3M16 6h4v2a3 3 0 01-3 3"/><path d="M12 14v4M8 20h8"/></g>
<text x="262.5" y="798" font-size="14" fill="#4B5563" font-weight="600" text-anchor="middle">Ranking</text>
</g>
<g id="nav-11" data-name="Navegación: Perfil" data-interactive="link" data-orden-foco="6">
<rect x="300" y="748" width="75" height="64" fill="none" data-hit="1"/>
<g transform="translate(325.5 756) scale(1)" fill="none" stroke="#4B5563" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a4 4 0 100 8 4 4 0 000-8z"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></g>
<text x="337.5" y="798" font-size="14" fill="#4B5563" font-weight="600" text-anchor="middle">Perfil</text>
</g>
</g>
<g id="contenido-principal" data-name="Contenido principal (main)" role="main">
<circle cx="187.5" cy="104" r="28" fill="#EEF0FF"/>
<g transform="translate(173.5 90) scale(1.17)" fill="none" stroke="#3730A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5L2.8 19.5h18.4z"/><path d="M12 10v4.5"/><path d="M12 17.2v.1"/></g>
<text x="187.5" y="179.4" font-size="24" fill="#1A1D21" font-weight="600" text-anchor="middle">El servicio no está</text>
<text x="187.5" y="209.4" font-size="24" fill="#1A1D21" font-weight="600" text-anchor="middle">disponible</text>
<text x="187.5" y="239.4" font-size="14" fill="#4B5563" text-anchor="middle">No es tu culpa y no perdiste lo que escribiste.</text>
<text x="187.5" y="260.4" font-size="14" fill="#4B5563" text-anchor="middle">Puedes volver a intentarlo en unos segundos (se</text>
<text x="187.5" y="281.4" font-size="14" fill="#4B5563" text-anchor="middle">reintenta solo en 30 s si es un 503).</text>
<g id="insignia-1" data-name="Insignia: 503 SERVICIO_NO_DISPONIBLE">
<rect x="54.22" y="303.5" width="266.57" height="27" rx="14" fill="#EBEEF3" stroke="#D7DDE8" stroke-width="1"/>
<g transform="translate(63.72 309) scale(0.67)" fill="none" stroke="#4B5563" stroke-width="2.62" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></g>
<text x="85.72" y="321.9" font-size="14" fill="#4B5563" font-weight="600">503 SERVICIO_NO_DISPONIBLE</text>
</g>
<g id="alerta-2" data-name="Alerta: Si falla la IA, arma tu desglose manual:" role="status">
<rect x="16" y="347" width="343" height="87" rx="8" fill="#E6F1FB"/>
<rect x="16" y="347" width="4" height="87" rx="2" fill="#0B5CAD"/>
<g transform="translate(32 359) scale(0.83)" fill="none" stroke="#084A8C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 11v5.5"/><path d="M12 7.6v.1"/></g>
<text x="64" y="374.4" font-size="14" fill="#1A1D21">Si falla la IA, arma tu desglose manual:</text>
<text x="64" y="395.4" font-size="14" fill="#1A1D21">las funciones que no dependen de la IA</text>
<text x="64" y="416.4" font-size="14" fill="#1A1D21">siguen disponibles.</text>
</g>
<g id="boton-3" data-name="Botón: Reintentar" data-interactive="button" data-orden-foco="7">
<rect x="16" y="450" width="343" height="44" fill="none" data-hit="1"/>
<rect x="16" y="450" width="343" height="44" rx="8" fill="#4338CA"/>
<text x="187.5" y="477.6" font-size="16" fill="#FFFFFF" font-weight="600" text-anchor="middle">Reintentar</text>
</g>
<g id="boton-4" data-name="Botón: Comprobar estado" data-interactive="button" data-orden-foco="8">
<rect x="16" y="502" width="343" height="44" fill="none" data-hit="1"/>
<rect x="17" y="503" width="341" height="42" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="2"/>
<text x="187.5" y="529.6" font-size="16" fill="#4338CA" font-weight="600" text-anchor="middle">Comprobar estado</text>
</g>
</g>
</svg>
