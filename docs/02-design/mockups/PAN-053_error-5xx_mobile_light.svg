<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-053" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-053 — Error 5xx: fallo del servidor o servicio no disponible (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Error 5xx: fallo del servidor o servicio no disponible. Ruta (estado en la página); rol todos; CU CU-006, CU-013, CU-014; EP EP-001, EP-002. Estado mostrado: 503 con Retry-After de 30 s: reintento automático y manual. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Nunca se muestran trazas ni detalles internos; la referencia sirve para soporte (RNF-004). 502/504 de la IA se tratan en cada pantalla. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: Reintentar; 8 Botón: Comprobar estado.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E3E8EF"/><rect width="3" height="6" fill="#8A4B00"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="812" fill="#F5F7FA"/>
<g id="barra-superior" data-name="Barra superior" role="banner">
<rect x="0" y="0" width="375" height="56" fill="#FFFFFF"/>
<line x1="0" y1="56" x2="375" y2="56" stroke="#D7DDE8" stroke-width="1"/>
<g id="logo-5" data-name="Logotipo FocusStrike" data-exempt="logo">
<rect x="16" y="12" width="32" height="32" rx="8" fill="#4338CA"/>
<g transform="translate(22.4 18.4) scale(0.8)" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/><path d="M12 12v.1"/></g>
<text x="58" y="34.3" font-size="18" fill="#1A1D21" font-weight="700">FocusStrike</text>
</g>
<g id="avatar-6" data-name="Menú de cuenta" data-interactive="button" data-orden-foco="1">
<rect x="319" y="6" width="44" height="44" fill="none" data-hit="1"/>
<circle cx="341" cy="28" r="18" fill="#4338CA"/>
<text x="341" y="33.6" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">A</text>
</g>
</g>
<g id="navegacion-inferior" data-name="Navegación inferior" role="navigation">
<rect x="0" y="748" width="375" height="64" fill="#FFFFFF"/>
<line x1="0" y1="748" x2="375" y2="748" stroke="#D7DDE8" stroke-width="1"/>
<g id="nav-7" data-name="Navegación: Inicio" data-interactive="link" data-orden-foco="2">
<rect x="0" y="748" width="75" height="64" fill="none" data-hit="1"/>
<g transform="translate(25.5 756) scale(1)" fill="none" stroke="#4B5563" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></g>
<text x="37.5" y="798" font-size="14" fill="#4B5563" font-weight="600" text-anchor="middle">Inicio</text>
</g>
