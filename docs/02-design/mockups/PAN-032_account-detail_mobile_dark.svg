<rect x="32" y="829" width="311" height="44" fill="none" data-hit="1"/>
<rect x="32" y="829" width="311" height="44" rx="8" fill="#F87171"/>
<text x="187.5" y="856.6" font-size="16" fill="#3B0A08" font-weight="600" text-anchor="middle">Eliminar cuenta</text>
