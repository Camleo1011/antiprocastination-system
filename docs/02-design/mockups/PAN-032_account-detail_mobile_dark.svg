<g id="tarjeta-3" data-name="Tarjeta">
<rect x="16.5" y="218.5" width="342" height="313" rx="12" fill="#1C2128" stroke="#2A323D" stroke-width="1"/>
<text x="32" y="251.3" font-size="18" fill="#F1F3F7" font-weight="600">Datos de la cuenta</text>
<text x="32" y="283.4" font-size="14" fill="#C3CAD6">Nombre</text>
<text x="162.62" y="285.6" font-size="16" fill="#F1F3F7">Ana Gómez</text>
<text x="32" y="311.4" font-size="14" fill="#C3CAD6">Correo</text>
<text x="162.62" y="313.6" font-size="16" fill="#F1F3F7">ana.gomez@correo.com</text>
<text x="32" y="339.4" font-size="14" fill="#C3CAD6">Rol</text>
<text x="162.62" y="341.6" font-size="16" fill="#F1F3F7">Cliente</text>
<text x="32" y="367.4" font-size="14" fill="#C3CAD6">Nivel de acceso</text>
<text x="162.62" y="369.6" font-size="16" fill="#F1F3F7">—</text>
<text x="32" y="395.4" font-size="14" fill="#C3CAD6">Puntaje</text>
<text x="162.62" y="397.6" font-size="16" fill="#F1F3F7">1.240</text>
<text x="32" y="423.4" font-size="14" fill="#C3CAD6">Zona horaria</text>
<text x="162.62" y="425.6" font-size="16" fill="#F1F3F7">America/Bogota</text>
<text x="32" y="451.4" font-size="14" fill="#C3CAD6">Tiene datos</text>
<text x="162.62" y="453.6" font-size="16" fill="#F1F3F7">Sí (el rol no puede</text>
<text x="162.62" y="477.6" font-size="16" fill="#F1F3F7">cambiarse)</text>
<text x="32" y="503.4" font-size="14" fill="#C3CAD6">Registro</text>
<text x="162.62" y="505.6" font-size="16" fill="#F1F3F7">01/10/2026</text>
</g>
<g id="tarjeta-4" data-name="Tarjeta">
<rect x="16.5" y="548.5" width="342" height="340" rx="12" fill="#1C2128" stroke="#2A323D" stroke-width="1"/>
<text x="32" y="581.3" font-size="18" fill="#F1F3F7" font-weight="600">Acciones según tu nivel</text>
<text x="32" y="613.4" font-size="14" fill="#C3CAD6">«Cambiar rol» está deshabilitado: la cuenta</text>
<text x="32" y="634.4" font-size="14" fill="#C3CAD6">tiene datos. «Cambiar nivel» no aparece porque</text>
<text x="32" y="655.4" font-size="14" fill="#C3CAD6">solo aplica a administradores.</text>
