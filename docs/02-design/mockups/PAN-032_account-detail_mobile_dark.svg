<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="913" viewBox="0 0 375 913" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-032" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-032 — Cuenta: detalle (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Cuenta: detalle. Ruta /admin/cuentas/:id; rol soporte+; CU CU-019, CU-020; EP EP-045. Estado mostrado: sesión de un super sobre una cuenta cliente con datos: Editar, Bloquear y Eliminar disponibles; Cambiar rol deshabilitado con el motivo en texto. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Soporte ve solo lectura; el moderador solo Editar y Bloquear en clientes y lectura en administradores (BR-021). 409 ULTIMO_SUPER / CUENTA_CON_DATOS como defensa. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: ‹ Cuentas; 3 Botón: Editar; 4 Botón: Bloquear; 5 Botón: Cambiar rol; 6 Botón: Eliminar cuenta.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="913" fill="#161A20"/>
