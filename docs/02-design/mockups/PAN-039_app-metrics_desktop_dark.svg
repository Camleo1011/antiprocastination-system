<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-039" data-dispositivo="desktop" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-039 — Métricas de la aplicación (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Métricas de la aplicación. Ruta /admin/metricas; rol moderador+; CU CU-021; EP EP-052. Estado mostrado: tres contadores de la aplicación vistos por un moderador (usuarios, metas y evidencias evaluadas). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Soporte no ve la sección ni entra por URL (403 NIVEL_ADMIN_INSUFICIENTE → PAN-048). Estado vacío: valores en 0. Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Navegación: Métricas; 6 Navegación: Error persistente; 7 Menú de cuenta; 8 Botón: Actualizar.</desc>
