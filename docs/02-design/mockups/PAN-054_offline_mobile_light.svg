<svg xmlns="http://www.w3.org/2000/svg" width="375" height="1051" viewBox="0 0 375 1051" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-054" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-054 — Sin conexión (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Sin conexión. Ruta (estado global); rol todos; CU CU-010, CU-012, CU-011; EP —. Estado mostrado: estado global sin conexión: banner, última agenda conocida con el reloj marcado como posiblemente desfasado y lo que no se puede hacer. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Los relojes se calculan con la última hora del servidor y se marcan «puede estar desfasado». El cliente reintenta al recuperar la conexión. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Fila: Estudiar capítulo 3; 8 Fila: Leer capítulo 2; 9 Fila: Caminar 30 min; 10 Botón: Reintentar.</desc>
