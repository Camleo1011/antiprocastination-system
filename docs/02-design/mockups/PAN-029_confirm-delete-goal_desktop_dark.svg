<title id="t">PAN-029 — Confirmar eliminación de meta (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Confirmar eliminación de meta. Ruta (modal); rol cliente; CU CU-008b; EP EP-026. Estado mostrado: diálogo de confirmación destructiva (el botón llama al servicio con confirmar=true); foco inicial en 'Cancelar'. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. role=alertdialog con foco atrapado; Escape = Cancelar; el contenido de fondo queda inerte (COMP-11, RF-META-002c). Regiones ARIA: banner, navigation, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Casilla: Entiendo que no se puede deshacer; 2 Botón: Cancelar; 3 Botón: Eliminar meta.</desc>
