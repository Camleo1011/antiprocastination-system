<title id="t">PAN-021 — Resultado y puntaje de la submeta (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Resultado y puntaje de la submeta. Ruta /submetas/:id/resultado; rol cliente; CU CU-016, CU-026, CU-011; EP EP-031, EP-010. Estado mostrado: submeta finalizada con dos envíos (Incoherente 50 + Excelente 50 = 100, tope 90) y tabla de los tres dictámenes. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Dictamen en texto + ícono + color (BR-031); 'Inválida' no es 'Error' (Error es un fallo técnico). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: Volver a la agenda; 8 Botón: Ver mi perfil.</desc>
