<title id="t">PAN-032 — Cuenta: detalle (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Cuenta: detalle. Ruta /admin/cuentas/:id; rol soporte+; CU CU-019, CU-020; EP EP-045. Estado mostrado: sesión de un super sobre una cuenta cliente con datos: Editar, Bloquear y Eliminar disponibles; Cambiar rol deshabilitado con el motivo en texto. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Soporte ve solo lectura; el moderador solo Editar y Bloquear en clientes y lectura en administradores (BR-021). 409 ULTIMO_SUPER / CUENTA_CON_DATOS como defensa. Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Navegación: Métricas; 6 Navegación: Error persistente; 7 Navegación: Métricas del LLM; 8 Menú de cuenta; 9 Botón: ‹ Cuentas; 10 Botón: Editar; 11 Botón: Bloquear; 12 Botón: Cambiar rol; 13 Botón: Eliminar cuenta.</desc>
