<rect x="40" y="335" width="1200" height="240" rx="12" fill="#1A1D21" fill-opacity="0.08"/><rect x="40.5" y="334.5" width="1199" height="239" rx="12" fill="#FFFFFF" stroke="#D7DDE8" stroke-width="1"/>
