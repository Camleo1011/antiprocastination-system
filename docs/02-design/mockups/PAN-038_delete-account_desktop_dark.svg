<title id="t">PAN-038 — Eliminar cuenta (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Eliminar cuenta. Ruta (modal); rol super; CU CU-019; EP EP-047. Estado mostrado: super confirma eliminar una cuenta: el correo escrito no coincide (CONFIRMACION_REQUERIDA); botón de eliminar aún en rojo y el foco en Cancelar. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Doble confirmación: escribir el correo y marcar la casilla; el cliente envía confirmar=true (RF-ADM-010). Errores 409 AUTOELIMINACION y ULTIMO_SUPER. Regiones ARIA: navigation, banner, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Campo: Escribe el correo de la cuenta para confirmar; 2 Casilla: Entiendo que no se puede deshacer; 3 Botón: Cancelar; 4 Botón: Eliminar cuenta.</desc>
