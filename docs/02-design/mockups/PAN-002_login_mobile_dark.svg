<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-002" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-002 — Inicio de sesión (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Inicio de sesión. Ruta /ingresar; rol visitante; CU CU-002, CU-004; EP EP-004, EP-006. Estado mostrado: tras registrarse: aviso de cuenta creada, formulario vacío. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Un solo mensaje para credenciales inválidas (anti-enumeración). Regiones ARIA: banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Campo: Correo electrónico; 2 Campo: Contraseña; 3 Botón: Ingresar; 4 Botón: ¿Olvidaste tu contraseña?; 5 Botón: Crear cuenta.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="812" fill="#0F1114"/>
<g id="cabecera" data-name="Cabecera" role="banner">
<rect x="0" y="0" width="375" height="56" fill="#0F1114"/>
<line x1="0" y1="56" x2="375" y2="56" stroke="#2A323D" stroke-width="1"/>
<g id="logo-9" data-name="Logotipo FocusStrike" data-exempt="logo">
<rect x="16" y="12" width="32" height="32" rx="8" fill="#A5B4FC"/>
<g transform="translate(22.4 18.4) scale(0.8)" fill="none" stroke="#1E1B4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/><path d="M12 12v.1"/></g>
<text x="58" y="34.3" font-size="18" fill="#F1F3F7" font-weight="700">FocusStrike</text>
</g>
</g>
<g id="contenido-principal" data-name="Contenido principal (main)" role="main">
<text x="16" y="99.4" font-size="24" fill="#F1F3F7" font-weight="600">Iniciar sesión</text>
<g id="alerta-1" data-name="Alerta: Cuenta creada. Inicia sesión." role="status">
<rect x="16" y="114" width="343" height="45" rx="8" fill="#12301F"/>
<rect x="16" y="114" width="4" height="45" rx="2" fill="#4FBF7B"/>
<g transform="translate(32 126) scale(0.83)" fill="none" stroke="#86D9A4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M8 12.5l3 3 5-6"/></g>
<text x="64" y="141.4" font-size="14" fill="#F1F3F7">Cuenta creada. Inicia sesión.</text>
</g>
<g id="campo-2" data-name="Campo: Correo electrónico">
<text x="16" y="190.4" font-size="14" fill="#F1F3F7" font-weight="600">Correo electrónico</text>
<g id="entrada-3" data-name="Entrada" data-interactive="input" data-orden-foco="1">
<rect x="16" y="200" width="343" height="44" fill="none" data-hit="1"/>
<rect x="17" y="201" width="341" height="42" rx="8" fill="#1C2128" stroke="#8D97A8" stroke-width="1"/>
<text x="28" y="227.6" font-size="16" fill="#A0A9B8">tu@correo.com</text>
</g>
</g>
