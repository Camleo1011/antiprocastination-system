<title id="t">PAN-033 — Cuentas: crear (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Cuentas: crear. Ruta /admin/cuentas/nueva; rol moderador+; CU CU-019; EP EP-044. Estado mostrado: sesión super creando un administrador sin elegir nivel: 422 NIVEL_ACCESO_REQUERIDO con mensaje en texto. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Crear administradores es exclusivo del super (BR-021, RF-ADM-014). La contraseña inicial sigue la política de RF-AUT-011. Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Navegación: Métricas; 6 Navegación: Error persistente; 7 Navegación: Métricas del LLM; 8 Menú de cuenta; 9 Botón: ‹ Cuentas; 10 Campo: Nombre; 11 Campo: Correo; 12 Campo: Contraseña inicial; 13 Casilla: Cliente; 14 Casilla: Administrador (solo super); 15 Campo: Nivel de acceso; 16 Botón: Cancelar; 17 Botón: Crear cuenta.</desc>
