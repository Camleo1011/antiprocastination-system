<title id="t">PAN-019 — Cargar evidencia (1.er y 2.º envío) (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Cargar evidencia (1.er y 2.º envío). Ruta /submetas/:id/evidencia; rol cliente; CU CU-013, CU-015, CU-014; EP EP-035, EP-036, EP-014, EP-015, EP-031. Estado mostrado: segundo envío (el primero fue a las 10:52, ver PAN-021) dentro del tiempo de gracia, que va de 11:02 a 11:14: archivo DOCX elegido, avisos de formato y conversión, confirmación explícita del envío. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Formatos y avisos según RF-EVID-003 y RF-IA-012; máximo 25 MB; el rechazo por formato o lectura no consume el envío. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: ‹ Volver a la submeta; 8 Zona de archivo; 9 Botón: Quitar; 10 Casilla: Voy a usar mi envío 2 de 2; 11 Botón: Enviar evidencia; 12 Botón: Cancelar.</desc>
