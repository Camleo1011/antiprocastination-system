<title id="t">PAN-010 — Crear meta (paso 1): datos (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Crear meta (paso 1): datos. Ruta /metas/nueva; rol cliente; CU CU-005; EP EP-014, EP-023. Estado mostrado: paso 1 de 6: «Requiere evidencia» activado sin consentimiento de IA; se ofrece revisar y aceptar (abre PAN-028) o seguir sin evidencia. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Los datos del asistente se conservan en el navegador entre pasos (el contrato no tiene EP de borradores). Si se rechaza la IA, el interruptor vuelve a apagado y la meta solo admite metas sin evidencia (RF-IA-011). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Campo: Nombre de la meta; 8 Campo: Categoría; 9 Campo: Descripción; 10 Campo: Tiempo total (horas); 11 Campo: Hora de inicio diaria; 12 Campo: Hora de fin diaria; 13 Conmutador: Requiere evidencia; 14 Botón: Revisar y aceptar; 15 Botón: Ahora no; 16 Casilla: Manual: tú inicias cada submeta; 17 Casilla: Automático: se inicia sola a la hora pro; 18 Botón: Cancelar; 19 Botón: Continuar.</desc>
