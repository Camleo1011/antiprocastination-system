<title id="t">PAN-024 — Calendario de actividad: detalle y tabla (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Calendario de actividad: detalle y tabla. Ruta /perfil/actividad; rol cliente; CU CU-031, CU-017; EP EP-011. Estado mostrado: pestaña «Tabla» (alternativa accesible del calendario): 5 días activos recientes con submetas iniciadas y evidencias. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. La tabla es la alternativa accesible al calendario (WCAG 1.4.1, BR-031). El calendario es una sola parada de tabulación con flechas entre celdas. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Pestaña: Calendario; 8 Pestaña: Tabla; 9 Botón: Anterior; 10 Botón: Siguiente.</desc>
