<title id="t">PAN-041 — Evidencias: listado (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Evidencias: listado. Ruta /admin/evidencias; rol soporte+; CU CU-021; EP EP-054. Estado mostrado: listado de 5 envíos con dictamen y estado en texto e ícono, incluidos dos en Error persistente. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. El listado no muestra contenido de evidencias. Estado vacío: «No hay evidencias con esos filtros». Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Navegación: Métricas; 6 Navegación: Error persistente; 7 Menú de cuenta; 8 Selector: Usuario: todos; 9 Selector: Dictamen: todos; 10 Selector: Estado: todos; 11 Selector: Rango de fechas; 12 Botón: Abrir; 13 Botón: Abrir; 14 Botón: Abrir; 15 Botón: Abrir; 16 Botón: Abrir; 17 Botón: Anterior; 18 Botón: Siguiente.</desc>
