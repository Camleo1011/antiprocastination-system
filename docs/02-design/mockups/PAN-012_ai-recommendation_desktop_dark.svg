<title id="t">PAN-012 — Crear meta: recomendación de IA (más de 12 h por día) (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Crear meta: recomendación de IA (más de 12 h por día). Ruta /metas/nueva/recomendacion; rol cliente; CU CU-007; EP EP-020, EP-014, EP-015. Estado mostrado: paso 3 de 6: aviso de bienestar (más de 12 h por día) y sugerencias de la IA, informativas; 'Continuar' siempre disponible. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. La recomendación nunca bloquea guardar la meta (RF-META-008); sin consentimiento de IA no se llama a la IA (CP-126). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: Aceptar y continuar; 8 Botón: Modificar mi plan; 9 Botón: Continuar sin recomendaciones.</desc>
