<text x="610" y="379.9" font-size="14" fill="#C7CDFE" font-weight="600">Generado con IA · informativo</text>
</g>
<text x="578" y="418.6" font-size="16" fill="#F1F3F7">Si agregas un tercer día, las 26 h quedan en 8 h 40 min por día, por debajo de 12 h.</text>
<text x="578" y="454.6" font-size="16" fill="#F1F3F7">Incluye una pausa de 15 min cada 2 h de estudio.</text>
<text x="578" y="490.6" font-size="16" fill="#F1F3F7">Evita programar después de las 22:00 para proteger tu descanso.</text>
<text x="578" y="524.4" font-size="14" fill="#C3CAD6">Estas sugerencias no bloquean tu meta: puedes guardarla tal como está.</text>
</g>
