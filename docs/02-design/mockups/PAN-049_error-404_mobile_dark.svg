<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-049" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-049 — Error 404: no encontrado (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Error 404: no encontrado. Ruta /no-encontrado; rol todos; CU CU-022, CU-011, CU-019; EP EP-024, EP-031, EP-045. Estado mostrado: 404 dentro de la aplicación del cliente: causa sin culpar y tres salidas (Metas, atrás, Agenda). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Mismo mensaje si el recurso no existe o es ajeno (no revela su existencia). El administrador ve «Ir al panel» en lugar de Metas. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Botón: Ir a Metas; 8 Botón: Volver atrás; 9 Botón: Ir a Agenda.</desc>
