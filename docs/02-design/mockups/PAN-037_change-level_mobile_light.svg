<title id="t">PAN-037 — Cambiar nivel de acceso (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Cambiar nivel de acceso. Ruta (modal); rol super; CU CU-019; EP EP-049. Estado mostrado: super sube de soporte a moderador a una cuenta administrador; permisos por nivel en texto. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. Matriz de BR-021. No se puede degradar al único super (409 ULTIMO_SUPER). Regiones ARIA: banner, navigation, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Campo: Nivel de acceso; 2 Botón: Cancelar; 3 Botón: Guardar nivel.</desc>
