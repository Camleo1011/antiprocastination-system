<title id="t">PAN-043 — Ranking de administración (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Ranking de administración. Ruta /admin/ranking; rol soporte+; CU CU-021, CU-018; EP EP-055. Estado mostrado: sesión soporte (solo lectura): ranking con empates y una cuenta bloqueada marcada con texto e ícono. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Por eso la posición de Ana Gómez es 13 aquí y 12 en el ranking de clientes (PAN-026): la cuenta bloqueada sí cuenta. Regiones ARIA: navigation, banner, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Panel; 2 Navegación: Cuentas; 3 Navegación: Evidencias; 4 Navegación: Ranking; 5 Menú de cuenta; 6 Botón: Anterior; 7 Botón: Siguiente.</desc>
