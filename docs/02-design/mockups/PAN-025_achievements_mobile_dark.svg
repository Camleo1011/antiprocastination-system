<title id="t">PAN-025 — Logros (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Logros. Ruta /perfil/logros; rol cliente; CU CU-017, CU-026; EP EP-010. Estado mostrado: racha de 5 días y catálogo de 7 logros: 3 obtenidos con fecha y 4 bloqueados con candado, texto y condición. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Bloqueado = ícono de candado + texto 'Bloqueado' + condición (nunca solo atenuado). Catálogo según BR-020. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil.</desc>
