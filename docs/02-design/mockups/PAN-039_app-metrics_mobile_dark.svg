<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-039" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-039 — Métricas de la aplicación (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Métricas de la aplicación. Ruta /admin/metricas; rol moderador+; CU CU-021; EP EP-052. Estado mostrado: tres contadores de la aplicación vistos por un moderador (usuarios, metas y evidencias evaluadas). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Soporte no ve la sección ni entra por URL (403 NIVEL_ADMIN_INSUFICIENTE → PAN-048). Estado vacío: valores en 0. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: Actualizar.</desc>
<defs><pattern id="rayas-gracia" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#2A323D"/><rect width="3" height="6" fill="#F5B93A"/></pattern></defs>
<rect id="fondo-pagina" width="375" height="812" fill="#161A20"/>
