<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-035" data-dispositivo="movil" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-035 — Bloquear o desbloquear cuenta (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Bloquear o desbloquear cuenta. Ruta (modal); rol moderador+; CU CU-020; EP EP-050, EP-051. Estado mostrado: sesión moderador sobre una cuenta cliente (con bloqueo temporal automático vigente): confirma bloquear administrativamente; foco inicial en Cancelar. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. El moderador solo bloquea o desbloquea cuentas cliente; las administrador son del super. El desbloqueo (RF-ADM-012) solo aplica a cuentas bloqueadas administrativamente, como Luis Prada en PAN-038. Un 409 ULTIMO_SUPER impide bloquear al único super. Regiones ARIA: banner, navigation, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Botón: Cancelar; 2 Botón: Bloquear cuenta.</desc>
