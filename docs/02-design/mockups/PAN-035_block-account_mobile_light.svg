<text x="40" y="244.3" font-size="18" fill="#1A1D21" font-weight="600">¿Bloquear la cuenta de Marta</text>
<text x="40" y="266.3" font-size="18" fill="#1A1D21" font-weight="600">Ríos?</text>
<text x="40" y="300.6" font-size="16" fill="#1A1D21">Cuenta: Marta Ríos ·</text>
<text x="40" y="324.6" font-size="16" fill="#1A1D21">marta.rios@correo.com</text>
<text x="40" y="362.4" font-size="14" fill="#4B5563">BLOQUEAR: se revocan sus sesiones</text>
<text x="40" y="383.4" font-size="14" fill="#4B5563">activas y deja de aparecer en el ranking de</text>
<text x="40" y="404.4" font-size="14" fill="#4B5563">clientes. Es un bloqueo administrativo,</text>
