<title id="t">PAN-031 — Cuentas: listado (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Cuentas: listado. Ruta /admin/cuentas; rol soporte+; CU CU-019; EP EP-043. Estado mostrado: sesión de un moderador: las filas de administradores muestran solo «Ver» (lectura); Editar y Bloquear existen solo en cuentas cliente (BR-021); estados con ícono y texto. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. La interfaz oculta lo que el nivel no puede hacer; el servidor responde 403 NIVEL_ADMIN_INSUFICIENTE como defensa (BR-021). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: Crear cuenta; 3 Campo: Buscar por nombre o correo; 4 Selector: Rol: todos; 5 Selector: Nivel: todos; 6 Selector: Bloqueo: todos; 7 Botón: Ver; 8 Botón: Editar; 9 Botón: Bloquear; 10 Botón: Ver; 11 Botón: Editar; 12 Botón: Desbloquear; 13 Botón: Ver; 14 Botón: Editar; 15 Botón: Bloquear; 16 Botón: Ver; 17 Botón: Ver; 18 Botón: Anterior; 19 Botón: Siguiente.</desc>
