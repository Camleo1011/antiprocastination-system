<title id="t">PAN-047 — Sesión cerrada o expirada (móvil 375 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Sesión cerrada o expirada. Ruta /sesion-expirada; rol todos; CU CU-004, CU-002; EP EP-005, EP-004. Estado mostrado: sesión vencida a los 60 min: diálogo de reingreso sobre la pantalla en curso (conserva lo escrito y vuelve a la ruta original). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. El contrato no tiene EP de renovación: se reingresa en un diálogo, con aviso previo a los 55 min. Cerrar sesión lleva a PAN-002. Regiones ARIA: banner, navigation, main, alertdialog. Orden de foco con Tab (coincide con el orden visual y del DOM): Diálogo abierto: el fondo queda inerte y el foco se atrapa en el diálogo; foco inicial en el botón seguro (Cancelar). 1 Campo: Correo electrónico; 2 Campo: Contraseña; 3 Botón: Cerrar sesión; 4 Botón: Ingresar.</desc>
