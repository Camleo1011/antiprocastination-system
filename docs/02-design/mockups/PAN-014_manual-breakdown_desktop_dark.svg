<title id="t">PAN-014 — Desglose manual de submetas (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Desglose manual de submetas. Ruta /metas/nueva/desglose-manual; rol cliente; CU CU-032, CU-008a; EP EP-023, EP-028. Estado mostrado: paso 5 de 6 (Submetas), 2 fechas = 2 filas: 422 DESGLOSE_SUMA_INVALIDA, la suma (25 h) no coincide con el tiempo total (26 h); fila 2 marcada con texto. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Una fila por fecha de trabajo, una submeta por fecha (BR-014). Duración en horas enteras ≥ 1. La diferencia se anuncia en una región aria-live=polite. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Campo: Nombre de la submeta; 8 Campo: Inicio; 9 Campo: Duración (h); 10 Campo: Nombre de la submeta; 11 Campo: Inicio; 12 Campo: Duración (h); 13 Botón: Repartir en partes iguales; 14 Botón: Atrás; 15 Botón: Continuar.</desc>
