<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="882" viewBox="0 0 1280 882" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-051" data-dispositivo="desktop" data-tema="claro" aria-labelledby="t d">
<title id="t">PAN-051 — Error 422: errores de validación (patrón) (escritorio 1280 px, tema claro)</title>
<desc id="d">Mockup de alta fidelidad de Error 422: errores de validación (patrón). Ruta (patrón de formularios); rol todos; CU CU-001, CU-005, CU-032, CU-019; EP EP-003, EP-023, EP-028, EP-044. Estado mostrado: patrón 422: resumen con role=alert que recibe el foco, enlaces a cada campo y error en texto junto a cada campo con borde y ícono. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema claro); texto editable. El error nunca se comunica solo con color; lo escrito se conserva; aria-invalid y aria-describedby por campo. Ejemplo del paso 1 (Datos); el mismo patrón sirve en los demás pasos, por ejemplo DESGLOSE_SUMA_INVALIDA en el paso 5. Cubre VALIDACION_FALLIDA, DESGLOSE_SUMA_INVALIDA, CAPACIDAD_HORARIO_INSUFICIENTE y similares. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Campo: Nombre de la meta; 8 Campo: Tiempo total (horas); 9 Campo: Hora de inicio diaria; 10 Campo: Hora de fin diaria; 11 Botón: Cancelar; 12 Botón: Continuar.</desc>
