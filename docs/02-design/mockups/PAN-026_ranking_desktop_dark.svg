<title id="t">PAN-026 — Ranking global (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Ranking global. Ruta /ranking; rol cliente; CU CU-018; EP EP-042. Estado mostrado: ranking global con empates (1, 2, 2, 4) y fila propia marcada con el texto 'Tú'. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Posición comunicada con número y texto, no solo con medalla o color (RF-RANK-003/004). Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: Anterior; 8 Botón: Siguiente; 9 Botón: Ir a mi posición.</desc>
