<text x="640" y="310.4" font-size="24" fill="#F1F3F7" font-weight="600" text-anchor="middle">Estamos armando tu plan</text>
<text x="640" y="340.6" font-size="16" fill="#C3CAD6" text-anchor="middle">Puede tardar hasta 2 minutos. Mantén esta pantalla abierta; puedes cancelar la espera.</text>
