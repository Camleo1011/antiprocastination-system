<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-016" data-dispositivo="desktop" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-016 — Desglose por IA: espera, resultado y fallo (escritorio 1280 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Desglose por IA: espera, resultado y fallo. Ruta /metas/:id/desglose; rol cliente; CU CU-006, CU-032; EP EP-027, EP-024, EP-028. Estado mostrado: espera síncrona pasados los 60 s: aviso 'tarda más de lo normal', cancelar y salida manual. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Sin tiempo límite impuesto al usuario (WCAG 2.2.1); el tiempo transcurrido se anuncia cada 15 s, no cada segundo. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Navegación: Inicio; 2 Navegación: Agenda; 3 Navegación: Metas; 4 Navegación: Ranking; 5 Navegación: Perfil; 6 Menú de cuenta; 7 Botón: Cancelar espera; 8 Botón: Armar manualmente.</desc>
