<text x="120" y="444.6" font-size="16" fill="#93C5FD" font-weight="600">Está tardando más de lo normal</text>
<text x="120" y="466.4" font-size="14" fill="#F1F3F7">Seguimos esperando la respuesta de la IA. Tu meta ya está guardada.</text>
