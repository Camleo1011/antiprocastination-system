<title id="t">PAN-006 — Inicio (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Inicio. Ruta /inicio; rol cliente; CU CU-024, CU-026, CU-009; EP EP-019, EP-010, EP-032. Estado mostrado: agenda del día con una submeta En curso, una Finalizada con puntos y dos Pendientes; indicadores de puntaje, racha y posición. Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Estado de submeta en texto con ícono (BR-031); franja de color de la meta solo decorativa. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Menú de cuenta; 2 Navegación: Inicio; 3 Navegación: Agenda; 4 Navegación: Metas; 5 Navegación: Ranking; 6 Navegación: Perfil; 7 Fila: Estudiar capítulo 3; 8 Botón: Abrir submeta; 9 Fila: Repasar vocabulario; 10 Fila: Estudiar capítulo 3; 11 Fila: Leer capítulo 2; 12 Fila: Caminar 30 min; 13 Botón: Ver agenda; 14 Botón: Crear meta.</desc>
