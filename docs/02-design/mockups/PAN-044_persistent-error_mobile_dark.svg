<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" data-pan="PAN-044" data-dispositivo="movil" data-tema="oscuro" aria-labelledby="t d">
<title id="t">PAN-044 — Evaluaciones en Error persistente (móvil 375 px, tema oscuro)</title>
<desc id="d">Mockup de alta fidelidad de Evaluaciones en Error persistente. Ruta /admin/error-persistente; rol moderador+; CU CU-030; EP EP-056. Estado mostrado: 2 evaluaciones con 48 h o más en Error, ordenadas por antigüedad, con acción Elegir (abre PAN-045). Colores, tipografía (Inter), espaciado y radios del sistema de diseño (tema oscuro); texto editable. Solo moderador o super (CU-030); soporte recibe 403 NIVEL_ADMIN_INSUFICIENTE. Datos coherentes con PAN-030, 041 y 045. Regiones ARIA: banner, navigation, main. Orden de foco con Tab (coincide con el orden visual y del DOM): Enlace de salto «Saltar al contenido principal» (visible solo al recibir el foco). 1 Abrir menú de administración; 2 Botón: Elegir; 3 Botón: Elegir; 4 Botón: Anterior; 5 Botón: Siguiente.</desc>
